# Paste this template into Streamlit Community Cloud's Advanced settings.
# Replace every value in angle brackets. Never commit the real secrets.toml.

DATABASE_URL = "postgresql://<role>:<password>@<host>-pooler.<region>.aws.neon.tech/<database>?sslmode=require&channel_binding=require"
AUTH_REQUIRED = "true"
BOOTSTRAP_ADMIN_EMAILS = "<admin@example.com>"
BOOTSTRAP_STAFF_EMAILS = ""

# Community Cloud storage is temporary. PostgreSQL remains the source of truth,
# and the workbook is regenerated whenever it is exported or data changes.
EXCEL_PATH = "/tmp/easyoats/EasyOats_Order_Tracker.xlsx"
BACKUP_DIR = "/tmp/easyoats/backups"
TEMPLATE_PATH = "templates/EasyOats_Order_Tracker.xlsx"

[auth]
redirect_uri = "https://<your-app-name>.streamlit.app/oauth2callback"
cookie_secret = "<generate-a-long-random-secret>"
client_id = "<google-client-id>"
client_secret = "<google-client-secret>"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
